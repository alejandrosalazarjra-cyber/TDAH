name: Compilar APK NeuroSync
# Compilación manual para no gastar minutos por cada cambio pequeño.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'index.html'
      - 'android/**'
      - 'assets/dragon/**'
  push:
    branches: [main, 'feature/pantallas-completas-alarma-pomodoro']
    paths:
      - '.github/workflows/android-apk.yml'
      - 'tests/test_dragon_motion.js'
      - 'tests/test_dragon_poses.js'

concurrency:
  group: neurosync-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Los ejecutores Ubuntu incluyen el Android SDK.
      # Omitir setup-android@v3: era el paso donde se detenía el job.
      - name: Verificar SDK Android disponible
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME" || { echo "::error::SDK Android no disponible"; exit 1; }
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt" ]; then
            echo "Instalando SDK Platform y Build Tools 35"
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          fi
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
          echo "SDK Android 35 y herramientas APK disponibles"

      - name: Validar ciclos y evoluciones de Azul
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_dragon_module.py' -v
          node tests/test_dragon_motion.js
          node tests/test_dragon_poses.js
          node tests/test_phase1_persistence.js
          node tests/test_phase1b_alarm_schedule.js
          node tests/test_phase1c_session_sync.js
          node tests/test_phase1d_native_recovery.js
          node tests/test_phase1e_snapshot_batch.js
          node tests/test_phase1e_restart_recovery.js
          node tests/test_alarm_studio.js
          node tests/test_alarm_studio_days.js
          node tests/test_task_studio.js
          node tests/test_task_sent_notifications.js
          node tests/test_task_background_sync.js
          node tests/test_public_backend_contract.js
          node --check backend/server.js
          node tests/test_public_backend_api.js
          node tests/test_public_oauth_wiring.js
          node tests/test_public_android_bridge.js
          node tests/test_departure_studio.js
          node tests/test_pomodoro_studio.js
          node tests/test_wellbeing_studio.js
          node tests/test_finance_studio.js
          node tests/test_widget_side_panel.js

      - name: Validar interfaz antes de compilar
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re, subprocess, tempfile
          html=Path('index.html').read_text(encoding='utf-8')
          assert 'NeuroFlow' not in html, 'Se detectó la interfaz anterior'
          assert 'netlify.app' not in html.lower(), 'No debe haber dependencias de Netlify'
          for tag in ['login-form','view-admin','view-tasks','view-alarms','view-calendar','view-bags']:
              assert f'id="{tag}"' in html, f'Falta sección {tag}'
          scripts=[part.split('</script>',1)[0] for part in html.split('<script>')[1:]]
          assert scripts, 'No hay JavaScript'
          for i,code in enumerate(scripts):
              path=Path(tempfile.gettempdir())/f'ns-syntax-{i}.js'
              path.write_text(code,encoding='utf-8')
              subprocess.run(['node','--check',str(path)],check=True)
          print('Interfaz validada: navegación, acceso, alarmas y sintaxis JS')
          PY

      - name: Comprobar componentes Android y configuración
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import sys
          from xml.etree import ElementTree as ET
          android = pathlib.Path("android/app/src/main")
          java = android / "java/com/neurosync/familia"
          required = [
              "AccountStore.java", "AlarmReceiver.java", "SyncService.java",
              "AlarmRingActivity.java", "TodayWidget.java",
              "FocusLauncherActivity.java", "AlarmAudioService.java", "SessionVault.java",
              "MainActivity.java", "FocusOverlayService.java", "BackupCrypto.java",
          ]
          errors = []
          for name in required:
              path = java / name
              if not path.is_file() or path.stat().st_size == 0:
                  errors.append(f"Falta o está vacío: {path}")
          for relative in ("res/xml/today_widget_info.xml", "res/layout/widget_today.xml",
                           "res/drawable/ic_neurosync.xml"):
              if not (android / relative).is_file():
                  errors.append(f"Falta recurso Android: {relative}")
          gradle = pathlib.Path("android/app/build.gradle").read_text()
          match = re.search(r"versionCode\s+(\d+)\b", gradle)
          if match is None or int(match.group(1)) < 1:
              errors.append("android/app/build.gradle debe declarar un versionCode válido")
          else:
              print(f"Versión Android detectada: {match.group(1)}")
          manifest_file = android / "AndroidManifest.xml"
          try:
              manifest = ET.parse(manifest_file).getroot()
              ns = "{http://schemas.android.com/apk/res/android}"
              activities = manifest.findall(".//activity")
              home = []
              for activity in activities:
                  for intent in activity.findall("intent-filter"):
                      if any(cat.get(ns+"name") == "android.intent.category.HOME" for cat in intent.findall("category")):
                          home.append(activity.get(ns+"name"))
              if home != [".FocusLauncherActivity"]:
                  errors.append(f"Debe existir solo FocusLauncherActivity como HOME; se encontraron: {home}")
              services = [x.get(ns+"name") for x in manifest.findall(".//service")]
              if ".FocusNotificationListener" in services:
                  errors.append("No activar permiso de escucha de notificaciones restringido")
              if ".AlarmAudioService" not in services:
                  errors.append("Falta servicio de sonido de alarmas")
              bridges = (java / "MainActivity.java").read_text() if (java / "MainActivity.java").is_file() else ""
              if len(re.findall(r"void\s+openMinimalHome\s*\(", bridges)) != 1:
                  errors.append("MainActivity debe exponer exactamente un método openMinimalHome")
          except Exception as exc:
              errors.append(f"No se pudo validar AndroidManifest.xml: {exc}")
          if errors:
              for problem in errors:
                  print(f"::error::{problem}")
              sys.exit(1)
          print("Verificación correcta: archivos, AndroidManifest, launcher, servicios y versionCode válido.")
          PY

      - name: Probar integración del launcher y las alarmas
        shell: bash
        run: |
          python3 tests/check_android_structure.py
          python3 - <<'PY'
          from pathlib import Path
          src=Path("index.html").read_text(encoding="utf-8")
          for required in ("id=\"view-habits\"", "streakKey()", "streak-days",
                           "setAlarmChallenge", "Resolver 3 sumas", "Tocar 12 veces"):
              assert required in src, f"No se encontró función NeuroSync 9.0: {required}"
          print("Contador privado y desafíos de alarma presentes")
          PY
          python3 - <<'PY'
          from pathlib import Path
          src=Path('index.html').read_text(encoding='utf-8')
          assert 'nat.restoreSession()' in src, 'No se restaura sesión al abrir NeuroSync'
          for feature in ('quick-capture-form','inbox-list','next-action','focus-five',
                          'function editTask(t)','function renderFocus()','function renderInbox()'):
              assert feature in src, f'Falta función de organización: {feature}'
          assert 'function nsTaskDueOn(t,date)' in src, 'El planificador debe conservar fechas y recurrencias'
          assert 'function nsBrandDashboardRender()' in src, 'La APK debe incluir el panel visual de NeuroSync'
          assert 'function nsDragonRender()' in src, 'La APK debe incluir el dragón de productividad'
          print('Sesión persistente, captura rápida, bandeja, foco y edición comprobados')
          PY
          python3 - <<'PY'
          from pathlib import Path
          java = Path("android/app/src/main/java/com/neurosync/familia/FocusLauncherActivity.java").read_text()
          assert "d.dismiss();showSettings();})" in java, "Falta punto y coma al guardar objetivo de uso"
          assert "persist();showSettings();}).show()" in java, "Falta punto y coma al configurar pausa"
          print("Comprobaciones de sintaxis corregidas")
          PY

      - name: Comprobar seguridad, alarmas y launcher
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'AlarmAudioService' android/app/src/main/AndroidManifest.xml
          grep -q 'FOREGROUND_SERVICE_MEDIA_PLAYBACK' android/app/src/main/AndroidManifest.xml
          grep -q 'AlarmAudioService.start' android/app/src/main/java/com/neurosync/familia/AlarmReceiver.java
          grep -q 'setAlarmClock' android/app/src/main/java/com/neurosync/familia/AlarmReceiver.java
          grep -q 'RoleManager.ROLE_HOME' android/app/src/main/java/com/neurosync/familia/MainActivity.java
          grep -q 'AlarmChallengeStore' android/app/src/main/java/com/neurosync/familia/AlarmRingActivity.java
          grep -q 'ACTION_SHOW_ALARMS' android/app/src/main/java/com/neurosync/familia/MainActivity.java
          grep -q 'MAX_ATTEMPTS=5' android/app/src/main/java/com/neurosync/familia/AccountStore.java
          grep -q 'Settings.ACTION_APP_NOTIFICATION_SETTINGS' android/app/src/main/java/com/neurosync/familia/FocusLauncherActivity.java
          if grep -q 'BIND_NOTIFICATION_LISTENER_SERVICE' android/app/src/main/AndroidManifest.xml; then
            echo '::error::Permiso restringido de notificaciones no autorizado'
            exit 1
          fi
          echo "Verificación de seguridad, permisos mínimos y alarmas completada"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Incluir la interfaz existente
        shell: bash
        run: |
          set -euo pipefail
          cp index.html android/app/src/main/assets/index.html
          test -s android/app/src/main/assets/index.html
          mkdir -p android/app/src/main/assets/modules
          cp modules/alarm_studio.js modules/alarm_studio.css android/app/src/main/assets/modules/
          cp modules/task_studio.js modules/task_studio.css android/app/src/main/assets/modules/
          cp modules/departure_studio.js modules/departure_studio.css android/app/src/main/assets/modules/
          cp modules/pomodoro_studio.js modules/pomodoro_studio.css android/app/src/main/assets/modules/
          cp modules/wellbeing_studio.js modules/wellbeing_studio.css android/app/src/main/assets/modules/
          cp modules/finance_studio.js modules/finance_studio.css android/app/src/main/assets/modules/
          test -s android/app/src/main/assets/modules/pomodoro_studio.js
          test -s android/app/src/main/assets/modules/pomodoro_studio.css
          # La escena Bosque fue generada con Higgsfield. Si el origen deja de estar
          # disponible, la APK mantiene su fondo animado CSS sin bloquear la compilación.
          mkdir -p android/app/src/main/assets/focus
          if curl --fail --location --silent --show-error --connect-timeout 10 --max-time 120 --retry 1 \
            'https://d8j0ntlcm91z4.cloudfront.net/user_3MDNXswrgR6N3gVdMwDFhTyzzP4/hf_20261118_051340_5295b8d3-4aa6-475a-8b6f-7060243830c8.mp4' \
            -o android/app/src/main/assets/focus/bosque.mp4; then
            test "$(wc -c < android/app/src/main/assets/focus/bosque.mp4)" -gt 10000 || rm -f android/app/src/main/assets/focus/bosque.mp4
          else
            rm -f android/app/src/main/assets/focus/bosque.mp4
            echo "::warning::Video Bosque temporalmente inaccesible; se utilizará ambiente animado local."
          fi
          test -s android/app/src/main/assets/modules/departure_studio.js
          test -s android/app/src/main/assets/modules/departure_studio.css
          test -s android/app/src/main/assets/modules/alarm_studio.js
          test -s android/app/src/main/assets/modules/alarm_studio.css
          mkdir -p android/app/src/main/assets/dragon
          cp assets/dragon/etapa-{1..6}.webp android/app/src/main/assets/dragon/
          for n in {1..6}; do test -s "android/app/src/main/assets/dragon/etapa-${n}.webp"; done
          mkdir -p android/app/src/main/assets/dragon/atlases
          cp assets/dragon/atlases/etapa-{1..6}.webp android/app/src/main/assets/dragon/atlases/
          for n in {1..6}; do test -s "android/app/src/main/assets/dragon/atlases/etapa-${n}.webp"; done

      - name: Preparar certificado estable de APK preview para Google OAuth
        id: preview_signing
        shell: bash
        env:
          NS_PREVIEW_SIGNING_KEY_B64: ${{ secrets.NS_PREVIEW_SIGNING_KEY_B64 }}
          NS_PREVIEW_SIGNING_PASSWORD: ${{ secrets.NS_PREVIEW_SIGNING_PASSWORD }}
          NS_PREVIEW_SIGNING_ALIAS: ${{ secrets.NS_PREVIEW_SIGNING_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$NS_PREVIEW_SIGNING_KEY_B64" ] || [ -z "$NS_PREVIEW_SIGNING_PASSWORD" ] || [ -z "$NS_PREVIEW_SIGNING_ALIAS" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Sin firma preview estable: se compilará la APK de prueba con inicio de sesión público oculto."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/ns-preview-signing"
          printf '%s' "$NS_PREVIEW_SIGNING_KEY_B64" | base64 -d > "$RUNNER_TEMP/ns-preview-signing/neurosync-preview.jks"
          chmod 600 "$RUNNER_TEMP/ns-preview-signing/neurosync-preview.jks"
          NS_PREVIEW_KEYSTORE_FILE="$RUNNER_TEMP/ns-preview-signing/neurosync-preview.jks"
          keytool -list -v -keystore "$NS_PREVIEW_KEYSTORE_FILE" -storepass:env NS_PREVIEW_SIGNING_PASSWORD -alias "$NS_PREVIEW_SIGNING_ALIAS" > "$RUNNER_TEMP/ns-preview-signing/fingerprint.txt"
          if ! grep -F 'SHA1: 3E:F5:74:B7:F3:8F:09:FB:B4:81:60:BC:40:57:1E:A7:D6:A4:90:63' "$RUNNER_TEMP/ns-preview-signing/fingerprint.txt" >/dev/null; then
            echo "::error::La clave preview no coincide con la firma registrada para Google OAuth. No se utilizará."
            exit 1
          fi
          echo "NS_PREVIEW_KEYSTORE_FILE=$NS_PREVIEW_KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "Certificado preview validado; firma registrada en Google Cloud."
      - name: Preparar firma permanente de distribución
        id: signing
        shell: bash
        env:
          NS_SIGNING_KEY_B64: ${{ secrets.NS_SIGNING_KEY_B64 }}
          NS_SIGNING_PASSWORD: ${{ secrets.NS_SIGNING_PASSWORD }}
          NS_SIGNING_ALIAS: ${{ secrets.NS_SIGNING_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$NS_SIGNING_KEY_B64" ] || [ -z "$NS_SIGNING_PASSWORD" ] || [ -z "$NS_SIGNING_ALIAS" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::La APK de PRUEBA está disponible. Para la APK definitiva con firma permanente ejecuta bash scripts/setup-signing.sh UNA vez en Codespaces."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/ns-signing"
          printf '%s' "$NS_SIGNING_KEY_B64" | base64 -d > "$RUNNER_TEMP/ns-signing/neurosync-release.jks"
          chmod 600 "$RUNNER_TEMP/ns-signing/neurosync-release.jks"
          echo "NS_KEYSTORE_FILE=$RUNNER_TEMP/ns-signing/neurosync-release.jks" >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "Firma estable cargada desde GitHub Secrets."
      - name: Compilar APK de prueba independiente (no sustituye tu instalación)
        working-directory: android
        shell: bash
        env:
          NS_SIGNING_PASSWORD: ${{ secrets.NS_SIGNING_PASSWORD }}
          NS_SIGNING_ALIAS: ${{ secrets.NS_SIGNING_ALIAS }}
          NS_PREVIEW_SIGNING_PASSWORD: ${{ secrets.NS_PREVIEW_SIGNING_PASSWORD }}
          NS_PREVIEW_SIGNING_ALIAS: ${{ secrets.NS_PREVIEW_SIGNING_ALIAS }}
          # URL pública de pruebas; el usuario no la introduce manualmente.
          NEUROSYNC_API_BASE_URL: https://neurosync-public-api-staging-vz3h.onrender.com
          # Configurar esta variable en GitHub Actions > Variables cuando exista OAuth.
          NEUROSYNC_GOOGLE_WEB_CLIENT_ID: ${{ vars.NEUROSYNC_GOOGLE_WEB_CLIENT_ID || '1033210706025-rgmt44l71ho2cuakl1o2qfs5j6ijsjkq.apps.googleusercontent.com' }}
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assemblePreview 2>&1 | tee "$RUNNER_TEMP/neurosync-gradle.log"

      - name: Verificar que la prueba contiene la interfaz nueva
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/preview/app-preview.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='com.neurosync.familia.preview' versionCode='10'"
          python3 - <<'PY'
          import zipfile,hashlib
          from pathlib import Path
          source=Path("index.html").read_bytes()
          with zipfile.ZipFile("android/app/build/outputs/apk/preview/app-preview.apk") as z:
              packed=z.read("assets/index.html")
              assert packed==source, "ERROR: La APK de prueba tiene una interfaz antigua"
              dex=b"".join(z.read(x) for x in z.namelist()
                            if x.startswith("classes") and x.endswith(".dex"))
              for name in (b"AlarmChallengeStore",b"AlarmRingActivity",b"SessionVault"):
                  assert name in dex, f"Falta clase Android: {name!r}"
              for name in (b'view-habits',b'buildInfo',b'setAlarmChallenge',b'ns-login-form',b'ns-brand-hero'):
                  assert name in packed, f"Falta control HTML: {name!r}"
          print("APK preview contiene HTML y funciones actuales.")
          print("SHA256 de HTML:",hashlib.sha256(packed).hexdigest())
          PY
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"

      - name: Publicar APK para comprobar funciones SIN borrar datos
        uses: actions/upload-artifact@v4
        with:
          name: NeuroSync-10-PRUEBA-INDEPENDIENTE
          path: android/app/build/outputs/apk/preview/app-preview.apk
          if-no-files-found: error
          retention-days: 30

      - name: Compilar APK instalable de distribución
        if: steps.signing.outputs.configured == 'true'
        working-directory: android
        shell: bash
        env:
          NS_SIGNING_PASSWORD: ${{ secrets.NS_SIGNING_PASSWORD }}
          NS_SIGNING_ALIAS: ${{ secrets.NS_SIGNING_ALIAS }}
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --warning-mode all assembleRelease 2>&1 | tee "$RUNNER_TEMP/neurosync-gradle.log"

      - name: Guardar registro de errores de compilación
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NeuroSync-Registro-Error
          path: ${{ runner.temp }}/neurosync-gradle.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Verificar versión, código real, firma y contenido APK
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK" || { echo "::error::No se generó app-release.apk"; exit 1; }
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/neurosync-apk-info.txt
          grep -q "package: name='com.neurosync.familia' versionCode='10' versionName='10.0.0'" /tmp/neurosync-apk-info.txt
          python3 - <<'PY'
          import hashlib,zipfile
          from pathlib import Path
          apk=Path('android/app/build/outputs/apk/release/app-release.apk')
          source=Path('index.html').read_bytes()
          with zipfile.ZipFile(apk) as archive:
              packaged=archive.read('assets/index.html')
              assert packaged==source, 'APK NO contiene el index.html actual'
              dex=b''.join(archive.read(n) for n in archive.namelist()
                 if n.startswith('classes') and n.endswith('.dex'))
          for feature in (b'AlarmChallengeStore',b'AlarmRingActivity',b'SessionVault',
                          b'FocusLauncherActivity'):
              assert feature in dex, f'Clase Android ausente en APK: {feature!r}'
          for feature in (b'view-habits',b'setAlarmChallenge',b'buildInfo',
                          b'quick-capture-form',b'ns-login-form',b'ns-brand-hero'):
              assert feature in packaged, f'Nueva funci\xc3\xb3n ausente: {feature!r}'
          print('VERIFICADO: APK contiene la interfaz y las clases de esta versión')
          print('SHA256 index.html empaquetado:',hashlib.sha256(packaged).hexdigest())
          print('Tamaño APK real:',apk.stat().st_size,'bytes')
          PY
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/neurosync-signature.txt
          sha256sum "$APK" | tee /tmp/neurosync-apk-sha256.txt

      - name: Publicar solo APK con firma permanente
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NeuroSync-Familia-Firmada
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Explicar cómo activar actualizaciones definitivas
        if: steps.signing.outputs.configured != 'true'
        shell: bash
        run: |
          echo "### Solo se ha publicado la APK PRUEBA" >> "$GITHUB_STEP_SUMMARY"
          echo "La prueba se instala junto a la aplicación existente y no migra sus datos." >> "$GITHUB_STEP_SUMMARY"
          echo "Para una APK definitiva que pueda actualizarse sin borrar datos, configura GitHub Secrets en un Codespace mediante: bash scripts/setup-signing.sh" >> "$GITHUB_STEP_SUMMARY"
