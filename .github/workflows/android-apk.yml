name: Compilar APK NeuroSync
on:
  push:
    branches: [main]
    paths: ['index.html', 'android/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Incluir la interfaz existente
        run: cp index.html android/app/src/main/assets/index.html
      - name: Compilar APK instalable de prueba
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NeuroSync-Familia-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
