name: Compilar APK NeuroSync
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Los ejecutores Ubuntu incluyen el Android SDK.
      # Omitir setup-android@v3: era el paso donde se detenía el job.
      - name: Verificar SDK Android disponible
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME" || { echo "::error::SDK Android no disponible"; exit 1; }
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            echo "Instalando Android SDK Platform 35"
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          fi
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          echo "SDK Android 35 disponible"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Incluir la interfaz existente
        shell: bash
        run: |
          set -euo pipefail
          cp index.html android/app/src/main/assets/index.html
          test -s android/app/src/main/assets/index.html

      - name: Compilar APK instalable
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Publicar APK para descarga
        uses: actions/upload-artifact@v4
        with:
          name: NeuroSync-Familia-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
