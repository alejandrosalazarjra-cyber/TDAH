# NeuroSync — PRUEBAS TEMPORALES ÚNICAMENTE.
# La base gratuita de Render expira a los 30 días y NO dispone de backups.
# No utilizar este Blueprint con cuentas personales o tareas importantes.
# Debe activarlo expresamente el propietario del proyecto de Render.
services:
  - type: web
    name: neurosync-public-api-staging
    runtime: docker
    plan: free
    region: virginia
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: ./start.sh
    autoDeployTrigger: off
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: neurosync-public-db-staging
          property: connectionString
      # Google OAuth se añadirá después en Environment; no permitir cuentas de prueba
      # hasta que exista un OAuth Web Client ID verificado.
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: staging
databases:
  - name: neurosync-public-db-staging
    plan: free
    region: virginia
    postgresMajorVersion: "16"
    databaseName: neurosync_stage
    user: neurosync
    ipAllowList: []
