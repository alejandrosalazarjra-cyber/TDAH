# Compilación independiente de GitHub Actions. Ejecutar manualmente en Codemagic.
# Variante preview: com.neurosync.familia.preview, instalable junto a la app principal.
workflows:
  neurosync-apk-preview:
    name: NeuroSync - APK de prueba independiente
    instance_type: mac_mini_m2
    max_build_duration: 90
    scripts:
      - name: Preparar Java y herramientas
        script: |
          set -eu
          export JAVA_HOME=$(/usr/libexec/java_home -v 17)
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          gradle --version
          test -d "$ANDROID_SDK_ROOT"
          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ]; then SDKMGR="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"; fi
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0"
          test -f "$ANDROID_SDK_ROOT/platforms/android-36/android.jar"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      - name: Validar funciones críticas
        script: |
          set -eu
          # Persistencia, sesiones, recuperación tras reinicio y programación nativa.
          node tests/test_phase1_persistence.js
          node tests/test_phase1b_alarm_schedule.js
          node tests/test_phase1c_session_sync.js
          node tests/test_phase1d_native_recovery.js
          node tests/test_phase1e_snapshot_batch.js
          node tests/test_phase1e_restart_recovery.js
          python3 tests/check_android_structure.py
          node tests/test_alarm_studio.js
          node tests/test_alarm_studio_days.js
          node tests/test_task_studio.js
          node tests/test_dragon_compact_ui.js
          node tests/test_task_sent_notifications.js
          node tests/test_task_background_sync.js
          node tests/test_public_backend_contract.js
          node --check backend/server.js
          node tests/test_public_backend_api.js
          node tests/test_public_launch_readiness.js
          node tests/test_google_play_gate.js
          node tests/test_public_oauth_wiring.js
          node tests/test_preview_signing_contract.js
          node tests/test_public_android_bridge.js
          node tests/test_departure_studio.js
          node tests/test_pomodoro_studio.js
          node tests/test_wellbeing_studio.js
          node tests/test_finance_studio.js
          node tests/test_widget_side_panel.js
      - name: Copiar todos los recursos actuales a la aplicación
        script: |
          set -eu
          mkdir -p android/app/src/main/assets/modules
          cp index.html android/app/src/main/assets/index.html
          for name in alarm_studio task_studio departure_studio pomodoro_studio wellbeing_studio finance_studio; do
            cp "modules/$name.js" "modules/$name.css" android/app/src/main/assets/modules/
          done
          mkdir -p android/app/src/main/assets/dragon/atlases
          for n in 1 2 3 4 5 6; do
            cp "assets/dragon/etapa-$n.webp" android/app/src/main/assets/dragon/
            cp "assets/dragon/atlases/etapa-$n.webp" android/app/src/main/assets/dragon/atlases/
          done
          # Video opcional: si falla, el ambiente Bosque sigue funcionando en CSS.
          mkdir -p android/app/src/main/assets/focus
          curl --fail --location --silent --show-error --connect-timeout 10 --max-time 90 \
            'https://d8j0ntlcm91z4.cloudfront.net/user_3MDNXswrgR6N3gVdMwDFhTyzzP4/hf_20261118_051340_5295b8d3-4aa6-475a-8b6f-7060243830c8.mp4' \
            -o android/app/src/main/assets/focus/bosque.mp4 || rm -f android/app/src/main/assets/focus/bosque.mp4
          test -s android/app/src/main/assets/index.html
          test -s android/app/src/main/assets/modules/finance_studio.js
      - name: Construir APK Android de prueba
        script: |
          set -eu
          # El servidor es público; el Client ID se configura en Codemagic como variable.
          export NEUROSYNC_API_BASE_URL="https://neurosync-public-api-staging-vz3h.onrender.com"
          export NEUROSYNC_GOOGLE_WEB_CLIENT_ID="${NEUROSYNC_GOOGLE_WEB_CLIENT_ID:-1033210706025-rgmt44l71ho2cuakl1o2qfs5j6ijsjkq.apps.googleusercontent.com}"
          export JAVA_HOME=$(/usr/libexec/java_home -v 17)
          export PATH="$JAVA_HOME/bin:$PATH"
          if [ -n "${NS_PREVIEW_SIGNING_KEY_B64:-}" ] && [ -n "${NS_PREVIEW_SIGNING_PASSWORD:-}" ] && [ -n "${NS_PREVIEW_SIGNING_ALIAS:-}" ]; then
            PREVIEW_KEY_DIR=$(mktemp -d)
            trap 'rm -rf "$PREVIEW_KEY_DIR"' EXIT
            export NS_PREVIEW_KEYSTORE_FILE="$PREVIEW_KEY_DIR/neurosync-preview.jks"
            python3 -c 'import os,base64,pathlib; pathlib.Path(os.environ["NS_PREVIEW_KEYSTORE_FILE"]).write_bytes(base64.b64decode(os.environ["NS_PREVIEW_SIGNING_KEY_B64"],validate=True))'
            chmod 600 "$NS_PREVIEW_KEYSTORE_FILE"
            keytool -list -v -keystore "$NS_PREVIEW_KEYSTORE_FILE" -storepass:env NS_PREVIEW_SIGNING_PASSWORD -alias "$NS_PREVIEW_SIGNING_ALIAS" > "$PREVIEW_KEY_DIR/fingerprint.txt"
            grep -F 'SHA1: 3E:F5:74:B7:F3:8F:09:FB:B4:81:60:BC:40:57:1E:A7:D6:A4:90:63' "$PREVIEW_KEY_DIR/fingerprint.txt" >/dev/null || { echo 'La firma preview no coincide con Google Cloud'; exit 1; }
            echo "Firma estable preview verificada para Google OAuth."
          else
            echo "Firma preview ausente: se compila sin acceso público con Google."
          fi
          cd android
          bash ../scripts/run-gradle.sh --no-daemon --stacktrace assemblePreview
      - name: Verificar APK final y código actualizado
        script: |
          set -eu
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          apk=Path('android/app/build/outputs/apk/preview/app-preview.apk')
          assert apk.exists() and apk.stat().st_size > 100_000, 'No se produjo un APK válido'
          with ZipFile(apk) as z:
              assert z.testzip() is None, 'Archivo APK corrupto'
              assert z.read('assets/index.html') == Path('index.html').read_bytes(), 'APK contiene una versión antigua'
              for name in ('alarm_studio','task_studio','departure_studio','pomodoro_studio','wellbeing_studio','finance_studio'):
                  assert z.getinfo('assets/modules/'+name+'.js')
              assert 'classes.dex' in z.namelist(), 'Faltan clases nativas'
          print('APK PREVIEW VERIFICADA:',apk,apk.stat().st_size,'bytes')
          PY
      - name: Preparar bundle de Google Play (solo si hay firma release)
        script: |
          set -eu
          if [ -z "${NS_SIGNING_KEY_B64:-}" ] || [ -z "${NS_SIGNING_PASSWORD:-}" ]; then
            echo "Sin firma release: el AAB no se construirá hasta configurar secretos del desarrollador."
            exit 0
          fi
          export NS_SIGNING_ALIAS="${NS_SIGNING_ALIAS:-neurosync}"
          KEY_DIR=$(mktemp -d)
          trap 'rm -rf "$KEY_DIR"' EXIT
          export NS_KEYSTORE_FILE="$KEY_DIR/neurosync-release.jks"
          python3 -c 'import base64,os,pathlib;pathlib.Path(os.environ["NS_KEYSTORE_FILE"]).write_bytes(base64.b64decode(os.environ["NS_SIGNING_KEY_B64"],validate=True))'
          chmod 600 "$NS_KEYSTORE_FILE"
          export NEUROSYNC_API_BASE_URL="${NEUROSYNC_PRODUCTION_API_BASE_URL:-}"
          export NEUROSYNC_GOOGLE_WEB_CLIENT_ID="${NEUROSYNC_GOOGLE_WEB_CLIENT_ID:-}"
          bash scripts/run-gradle.sh --no-daemon --stacktrace -p android bundleRelease
          test -s android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab > "$KEY_DIR/aab-verify.txt"
    artifacts:
      - android/app/build/outputs/apk/preview/*.apk
      - android/app/build/outputs/bundle/release/*.aab
